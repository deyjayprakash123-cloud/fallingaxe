<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Falling Pickaxe - Mine Descent</title>
  <meta name="description" content="A fast-paced physics-based falling pickaxe mining arcade game with USD betting wallet and 4-chance selector wheel.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#120c14">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0810;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 540px;
      max-height: 960px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #140c14;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    canvas {
      display: block;
      touch-action: none;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #120c16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffcc00;
      font-size: 18px;
      font-weight: bold;
      z-index: 100;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255, 204, 0, 0.2);
      border-top-color: #ffcc00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading-screen">
      <div class="spinner"></div>
      <div>LOADING MINE...</div>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script type="module">
    import { Game } from './src/game.js';

    window.addEventListener('DOMContentLoaded', async () => {
      const canvas = document.getElementById('gameCanvas');
      const loading = document.getElementById('loading-screen');
      const game = new Game(canvas);
      await game.start();

      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 350);
      }
    });
  </script>
</body>
</html>
